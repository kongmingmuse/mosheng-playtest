<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eee6d4">
<meta name="description" content="墨生 · 字即世界 — type a word, watch it turn into a living ink painting.">
<title>墨生 · 字即世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{--paper:#eee6d4;--ink:#1a1a1c;--red:#b22a20;--line:rgba(26,26,28,.28);--sub:rgba(26,26,28,.5)}
  body.night{--paper:#0e0f12;--ink:#e6e4dc;--line:rgba(230,228,220,.28);--sub:rgba(230,228,220,.45)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);transition:background 1.5s;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  body{font-family:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas#c{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  /* 隐藏输入框：用来接住输入法（拼音）打出的字 */
  #ime{position:fixed;left:50%;bottom:140px;width:2px;height:24px;opacity:0;border:0;outline:0;resize:none;font-size:16px;background:transparent;color:transparent;caret-color:transparent;z-index:1}
  #seal{position:fixed;left:28px;top:26px;display:flex;gap:10px;align-items:flex-start;z-index:5}
  #seal .stamp{width:46px;height:58px;background:var(--red);color:#f6eee0;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:24px;box-shadow:inset 0 0 0 2px rgba(255,240,220,.25)}
  #seal .tag{writing-mode:vertical-rl;font-size:12px;letter-spacing:4px;color:var(--sub)}
  #tools{position:fixed;right:26px;top:26px;display:flex;gap:10px;z-index:5}
  #tools button{font-family:inherit;font-size:15px;padding:5px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--sub);cursor:pointer;transition:all .3s}
  #tools button.on{background:var(--red);border-color:var(--red);color:#f6eee0}
  #poem{position:fixed;right:42px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:26px;letter-spacing:10px;color:var(--ink);opacity:0;transition:opacity 1.2s;z-index:4;pointer-events:none}
  #poem small{display:block;font-size:12px;letter-spacing:3px;color:var(--red);margin-right:10px}
  #bar{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
  #bar button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;font-size:18px;cursor:pointer;transition:all .25s;opacity:.75}
  #bar button:hover{opacity:1;border-color:var(--red);color:var(--red);transform:translateY(-2px)}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--sub);letter-spacing:1px;white-space:nowrap;z-index:5;font-family:"STKaiti","KaiTi",serif}
  #hint b{font-weight:normal;color:var(--red)}
  #bar{max-width:94vw;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:2px 4px}
  #bar::-webkit-scrollbar{display:none}
  #bar button{flex-shrink:0}
  body.en #bar button{width:auto;border-radius:999px;padding:0 11px;font-family:"Kaushan Script",cursive;font-size:15px}
  body.en #poem{writing-mode:horizontal-tb;top:86px;right:50%;transform:translateX(50%);font-family:"Kaushan Script",cursive;font-size:24px;letter-spacing:1px;text-align:center;white-space:nowrap}
  body.en #poem small{margin:4px 0 0;font-size:13px}
  #pal{position:fixed;left:26px;bottom:34px;display:flex;gap:7px;z-index:5}
  #pal button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  #pal button i{display:block;width:14px;height:14px;border-radius:50%}
  #pal button.on{border:2px solid var(--red)}
  #write{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));z-index:6;font-family:inherit;font-size:17px;padding:8px 22px;border-radius:999px;border:1px solid var(--red);background:var(--red);color:#f6eee0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  body.en #write{font-family:"Kaushan Script",cursive}
  #typing{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;font-family:"Kaushan Script",cursive;font-size:30px;color:var(--ink);opacity:.75;z-index:6;pointer-events:none;white-space:nowrap}
  #typing:not(:empty)::after{content:'|';opacity:.4;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  /* 手机 / 触屏 */
  @media (hover:none),(max-width:700px){
    #write{display:block}
    #seal{left:14px;top:calc(14px + env(safe-area-inset-top))}
    #seal .stamp{width:36px;height:46px;font-size:17px;line-height:19px}
    #seal .tag{font-size:10px;letter-spacing:2px}
    #tools{right:12px;top:calc(14px + env(safe-area-inset-top));gap:6px}
    #tools button{font-size:13px;padding:4px 10px}
    #poem{right:14px;font-size:20px;letter-spacing:6px}
    body.en #poem{top:74px;font-size:19px}
    #bar{left:0;transform:none;width:100vw;max-width:100vw;bottom:calc(30px + env(safe-area-inset-bottom));padding:2px 12px;gap:7px}
    #bar button{width:38px;height:38px;font-size:19px;opacity:.85}
    #hint{bottom:calc(10px + env(safe-area-inset-bottom));font-size:10.5px;max-width:96vw;overflow:hidden;text-overflow:ellipsis}
    #pal{left:12px;bottom:calc(84px + env(safe-area-inset-bottom));flex-direction:column}
    #pal button{width:32px;height:32px}
    #typing{bottom:calc(140px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<textarea id="ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></textarea>
<div id="seal"><div class="stamp"><span>墨</span><span>生</span></div><div class="tag" id="tag">字即世界 · 落笔成灵</div></div>
<div id="tools"><button id="bAuto">自在</button><button id="bSound" class="on">有声</button><button id="bShot">留影</button><button id="bLang">EN</button></div>
<div id="poem"></div>
<div id="bar"></div>
<div id="hint"></div>
<div id="pal"></div>
<button id="write">✎ 写字</button>
<div id="typing"></div>

<script>
'use strict';
// ========== 基础 ==========
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, MIN = 0, now = 0;
const FONT = '"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC","Songti SC",serif';
const FONT_EN = '"Kaushan Script","Brush Script MT","Segoe Script",cursive';
const isLatin = t => /^[A-Za-z][A-Za-z'\-]*$/.test(t);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1)})`;

// 主题：T=0 白昼宣纸，T=1 月夜
let T = 0, Ttarget = 0;
const C = {};
function updateColors() {
  C.paper = mixc([238, 230, 212], [14, 15, 18], T);
  C.ink = mixc([24, 24, 26], [228, 228, 220], T);
  C.red = mixc([178, 42, 32], [225, 85, 55], T);
  C.teal = mixc([36, 104, 96], [110, 205, 185], T);
  C.mist = mixc([238, 230, 212], [14, 15, 18], T);
}
updateColors();

// ========== 纸纹 ==========
const paperTex = document.createElement('canvas');
(function makePaper() {
  paperTex.width = paperTex.height = 512;
  const p = paperTex.getContext('2d');
  for (let i = 0; i < 9000; i++) {
    p.fillStyle = `rgba(110,90,60,${rand(0.02, 0.07)})`;
    p.fillRect(rand(0, 512), rand(0, 512), rand(0.5, 1.6), rand(0.5, 1.6));
  }
  p.lineCap = 'round';
  for (let i = 0; i < 700; i++) {
    const x = rand(0, 512), y = rand(0, 512), a = rand(0, Math.PI * 2), l = rand(3, 16);
    p.strokeStyle = `rgba(120,95,60,${rand(0.03, 0.08)})`; p.lineWidth = rand(0.3, 0.8);
    p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.cos(a) * l * .5 + rand(-2, 2), y + Math.sin(a) * l * .5 + rand(-2, 2), x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
  }
})();
let paperPat = null;

// ========== 流体（墨在水里晕开） ==========
let gw, gh, cxs, cys, N;
let U, V, U0, V0, P, DIV, CURL, DK, DR, DC, TMP;
let dyeCanvas, dyeCtx, dyeImg;
function initFluid() {
  gw = W > H ? 160 : 100; gh = Math.max(60, Math.round(gw * H / W));
  cxs = W / gw; cys = H / gh; N = gw * gh;
  const F = () => new Float32Array(N);
  U = F(); V = F(); U0 = F(); V0 = F(); P = F(); DIV = F(); CURL = F(); DK = F(); DR = F(); DC = F(); TMP = F();
  dyeCanvas = document.createElement('canvas'); dyeCanvas.width = gw; dyeCanvas.height = gh;
  dyeCtx = dyeCanvas.getContext('2d'); dyeImg = dyeCtx.createImageData(gw, gh);
}
function sample(f, x, y) {
  x = clamp(x, 0, gw - 1.001); y = clamp(y, 0, gh - 1.001);
  const i = x | 0, j = y | 0, fx = x - i, fy = y - j, id = i + j * gw;
  return (f[id] * (1 - fx) + f[id + 1] * fx) * (1 - fy) + (f[id + gw] * (1 - fx) + f[id + gw + 1] * fx) * fy;
}
function advect(src, dst, dt, diss) {
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const id = i + j * gw;
    dst[id] = sample(src, i - dt * U[id], j - dt * V[id]) * diss;
  }
}
let dyeDiss = 0.9975, clearing = 0;
function fluidStep(dt) {
  // 涡度增强：让墨烟卷出漩涡
  for (let j = 1; j < gh - 1; j++) for (let i = 1; i < gw - 1; i++) {
    const id = i + j * gw;
    CURL[id] = (V[id + 1] - V[id - 1] - U[id + gw] + U[id - gw]) * 0.5;
  }
  const eps = 9;
  for (let j = 2; j < gh - 2; j++) for (let i = 2; i < gw - 2; i++) {
    const id = i + j * gw;
    const nx = (Math.abs(CURL[id + 1]) - Math.abs(CURL[id - 1])) * 0.5;
    const ny = (Math.abs(CURL[id + gw]) - Math.abs(CURL[id - gw])) * 0.5;
    const l = Math.hypot(nx, ny) + 1e-5, w = CURL[id];
    U[id] += eps * (ny / l) * w * dt; V[id] -= eps * (nx / l) * w * dt;
  }
  const vd = Math.pow(0.985, dt * 60);
  advect(U, U0, dt, vd); advect(V, V0, dt, vd);
  let t = U; U = U0; U0 = t; t = V; V = V0; V0 = t;
  // 边界
  for (let i = 0; i < gw; i++) { U[i] = V[i] = U[i + (gh - 1) * gw] = V[i + (gh - 1) * gw] = 0; }
  for (let j = 0; j < gh; j++) { U[j * gw] = V[j * gw] = U[j * gw + gw - 1] = V[j * gw + gw - 1] = 0; }
  // 投影：保持不可压缩
  for (let j = 1; j < gh - 1; j++) for (let i = 1; i < gw - 1; i++) {
    const id = i + j * gw;
    DIV[id] = -0.5 * (U[id + 1] - U[id - 1] + V[id + gw] - V[id - gw]);
  }
  for (let k = 0; k < 14; k++) {
    for (let j = 1; j < gh - 1; j++) for (let i = 1; i < gw - 1; i++) {
      const id = i + j * gw;
      P[id] = (DIV[id] + P[id - 1] + P[id + 1] + P[id - gw] + P[id + gw]) * 0.25;
    }
  }
  for (let j = 1; j < gh - 1; j++) for (let i = 1; i < gw - 1; i++) {
    const id = i + j * gw;
    U[id] -= 0.5 * (P[id + 1] - P[id - 1]); V[id] -= 0.5 * (P[id + gw] - P[id - gw]);
  }
  const dd = Math.pow(clearing > 0 ? 0.93 : dyeDiss, dt * 60);
  advect(DK, TMP, dt, dd); DK.set(TMP);
  advect(DR, TMP, dt, dd); DR.set(TMP);
  advect(DC, TMP, dt, dd); DC.set(TMP);
}
// 在屏幕坐标 (x,y) 点一笔：速度 (dx,dy) 像素/秒，颜料 col = 'k'|'r'|'c'|'w'(清水)
function splat(x, y, dx, dy, rad, col, amt) {
  const gx = x / cxs, gy = y / cys, r = rad / cxs, r2 = r * r;
  const i0 = Math.max(1, (gx - r * 2.5) | 0), i1 = Math.min(gw - 2, (gx + r * 2.5) | 0);
  const j0 = Math.max(1, (gy - r * 2.5) | 0), j1 = Math.min(gh - 2, (gy + r * 2.5) | 0);
  const D = col === 'r' ? DR : col === 'c' ? DC : DK;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const d2 = (i - gx) ** 2 + (j - gy) ** 2, w = Math.exp(-d2 / r2);
    if (w < 0.01) continue;
    const id = i + j * gw;
    U[id] += dx / cxs * w; V[id] += dy / cys * w;
    if (col === 'w') { const f = 1 - 0.25 * w * amt; DK[id] *= f; DR[id] *= f; DC[id] *= f; }
    else if (amt) D[id] = Math.min(4, D[id] + amt * w);
  }
}
function renderDye() {
  const d = dyeImg.data, k = C.ink, r = C.red, c = C.teal;
  for (let id = 0, p = 0; id < N; id++, p += 4) {
    const a = DK[id], b = DR[id], e = DC[id], s = a + b + e;
    if (s < 0.004) { d[p + 3] = 0; continue; }
    d[p] = (a * k[0] + b * r[0] + e * c[0]) / s;
    d[p + 1] = (a * k[1] + b * r[1] + e * c[1]) / s;
    d[p + 2] = (a * k[2] + b * r[2] + e * c[2]) / s;
    d[p + 3] = 255 * (1 - Math.exp(-s * 1.7));
  }
  dyeCtx.putImageData(dyeImg, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(dyeCanvas, 0, 0, W, H);
}
// 把字形“写”进流体：字化成墨烟
const glyphCv = document.createElement('canvas'), glyphCtx = glyphCv.getContext('2d', { willReadFrequently: true });
function injectGlyph(ch, x, y, size, col, font) {
  glyphCv.width = gw; glyphCv.height = gh;
  glyphCtx.clearRect(0, 0, gw, gh);
  glyphCtx.fillStyle = '#000'; glyphCtx.textAlign = 'center'; glyphCtx.textBaseline = 'middle';
  glyphCtx.font = `${size / cxs}px ${font || FONT}`;
  glyphCtx.fillText(ch, x / cxs, y / cys);
  const data = glyphCtx.getImageData(0, 0, gw, gh).data;
  const D = col === 'r' ? DR : col === 'c' ? DC : DK;
  // 几个随机漩涡中心，让墨卷起来
  const vs = [];
  for (let n = 0; n < 3; n++) vs.push([x / cxs + rand(-1, 1) * size / cxs * 0.4, y / cys + rand(-1, 1) * size / cys * 0.4, rand(18, 34) * (Math.random() < .5 ? -1 : 1)]);
  for (let id = 0; id < N; id++) {
    const a = data[id * 4 + 3] / 255; if (a < 0.05) continue;
    D[id] = Math.min(4, D[id] + a * 1.6);
    const i = id % gw, j = (id / gw) | 0;
    for (const [vx, vy, s] of vs) {
      const dx = i - vx, dy = j - vy, d = Math.hypot(dx, dy) + 2;
      U[id] += -dy / d * s * a / Math.sqrt(d) * 1.2; V[id] += dx / d * s * a / Math.sqrt(d) * 1.2;
    }
    V[id] -= 4 * a;
  }
}

// ========== 场景对象 ==========
let scene = [];      // 静景与生灵
let fx = [];         // 粒子、闪电、字形等短命效果
let wind = 0, windT = 0, shake = 0, flash = 0;
const has = k => scene.find(o => o.kind === k && !o.dying);

// 1D 噪声
function noise1(seed) {
  const v = []; for (let i = 0; i < 256; i++) v.push(Math.random());
  return x => { x = x * 8 + seed; const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f); return lerp(v[((i % 256) + 256) % 256], v[(((i + 1) % 256) + 256) % 256], s); };
}

class Base { constructor(kind) { this.kind = kind; this.born = now; this.dying = false; this.fade = 1; } get rev() { return clamp((now - this.born) / 2.2, 0, 1) * this.fade; } }

// —— 山 ——
class Mountains extends Base {
  constructor(n) {
    super('山'); this.layers = [];
    const cnt = 3;
    for (let L = 0; L < cnt; L++) {
      const nA = noise1(rand(0, 99)), nB = noise1(rand(0, 99)), nC = noise1(rand(0, 99));
      const peaks = [rand(.1, .9), rand(.1, .9)], ys = [];
      const base = 0.5 + L * 0.09 + n * 0.03, amp = 0.2 - L * 0.035;
      for (let i = 0; i <= 160; i++) {
        const x = i / 160;
        let h = 0.55 * nA(x * 0.5) + 0.3 * nB(x * 1.6) + 0.15 * nC(x * 4);
        for (const pk of peaks) h += 0.55 * Math.exp(-((x - pk) ** 2) / 0.006);
        ys.push(base - amp * h);
      }
      const cun = []; // 皴笔
      for (let k = 0; k < 70; k++) { const x = Math.random(); cun.push([x, rand(0.005, 0.09), rand(0.012, 0.035), rand(-0.6, 0.6)]); }
      this.layers.push({ ys, cun, a: [0.16, 0.28, 0.48][L] });
    }
  }
  draw() {
    const r = this.rev;
    if (r <= 0) return;
    for (const l of this.layers) {
      let top = 1; for (const y of l.ys) top = Math.min(top, y);
      const g = ctx.createLinearGradient(0, top * H, 0, top * H + H * 0.36);
      g.addColorStop(0, rgba(C.ink, l.a * r)); g.addColorStop(0.55, rgba(C.ink, l.a * 0.45 * r)); g.addColorStop(1, rgba(C.ink, 0));
      ctx.beginPath(); ctx.moveTo(0, H);
      l.ys.forEach((y, i) => ctx.lineTo(i / 160 * W, y * H));
      ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = rgba(C.ink, l.a * 1.1 * r); ctx.lineWidth = 1.2;
      ctx.beginPath(); l.ys.forEach((y, i) => i ? ctx.lineTo(i / 160 * W, y * H) : ctx.moveTo(0, y * H)); ctx.stroke();
      ctx.lineWidth = 0.8; ctx.strokeStyle = rgba(C.ink, l.a * 0.9 * r);
      for (const [x, d, len, sl] of l.cun) {
        const y = l.ys[Math.round(x * 160)] + d;
        ctx.beginPath(); ctx.moveTo(x * W, y * H); ctx.lineTo(x * W + sl * len * H, (y + len) * H); ctx.stroke();
      }
    }
    // 山间云雾
    const m = ctx.createLinearGradient(0, H * 0.62, 0, H);
    m.addColorStop(0, rgba(C.mist, 0)); m.addColorStop(0.5, rgba(C.mist, 0.35 * r)); m.addColorStop(1, rgba(C.mist, 0.1 * r));
    ctx.fillStyle = m; ctx.fillRect(0, H * 0.62, W, H * 0.38);
  }
}
// —— 月 ——
class Moon extends Base {
  constructor() { super('月'); this.pulse = 0; }
  draw() {
    const r = this.rev, x = W * 0.8, y = H * 0.2, R = MIN * 0.06 * (1 + this.pulse * 0.08);
    this.pulse *= 0.97;
    const glow = ctx.createRadialGradient(x, y, R * 0.8, x, y, R * (3 + T * 2));
    const gc = mixc([150, 150, 150], [255, 250, 230], T);
    glow.addColorStop(0, rgba(gc, (0.18 + T * 0.25) * r)); glow.addColorStop(1, rgba(gc, 0));
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, R * 5, 0, 7); ctx.fill();
    ctx.fillStyle = rgba(mixc([248, 244, 234], [255, 252, 238], T), r);
    ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
    ctx.strokeStyle = rgba(C.ink, 0.25 * r * (1 - T)); ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = rgba(mixc([200, 195, 185], [225, 222, 205], T), 0.4 * r);
    ctx.beginPath(); ctx.arc(x - R * 0.3, y - R * 0.2, R * 0.22, 0, 7); ctx.arc(x + R * 0.25, y + R * 0.3, R * 0.15, 0, 7); ctx.fill();
  }
}
// —— 竹 ——
function leaf(x, y, ang, len, wid, col) {

const SCALE = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3, 784.0];
function pluck(f, vol) {
  const a = ac(); if (!a) return; const t = a.currentTime;
  const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 3);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 7, t); lp.frequency.exponentialRampToValueAtTime(f * 1.4, t + 1.8);
  [[1, 'triangle', 1], [2, 'sine', 0.3], [3, 'sine', 0.12]].forEach(([h, ty, v]) => { const o = a.createOscillator(); o.type = ty; o.frequency.value = f * h; const og = a.createGain(); og.gain.value = v; o.connect(og).connect(lp); o.start(t); o.stop(t + 3.1); });
  lp.connect(g).connect(a.destination);
}
function sfxChar(ch, key) { if (!soundOn) return; const c = ch.codePointAt(0); pluck(SCALE[c % SCALE.length] / (key === '龙' || key === '山' ? 2 : 1), 0.16); setTimeout(() => pluck(SCALE[(c >> 3) % SCALE.length] * 0.5, 0.07), 180); }
function sfxNoise(dur, type, freq, vol) {
  if (!soundOn) return; const a = ac(); if (!a) return; const t = a.currentTime;
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = buf; const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}

// ========== 交互 ==========
const mouse = { x: -999, y: -999, t: -99, down: false, lx: 0, ly: 0 };
const ime = document.getElementById('ime');
const focusIme = (force) => { if (coarse && !force) return; ime.focus({ preventScroll: true }); };
let lastComp = { s: '', t: 0 }, composing = false;
ime.addEventListener('compositionstart', () => composing = true);
ime.addEventListener('compositionend', e => { composing = false; if (e.data) { handleText(e.data, true); lastComp = { s: e.data, t: performance.now() }; } ime.value = ''; });
ime.addEventListener('input', e => {
  if (e.isComposing || composing) return;
  const s = e.data || ime.value;
  if (e.inputType === 'insertLineBreak') { flushWord(); ime.value = ''; return; }
  if (s && !(s === lastComp.s && performance.now() - lastComp.t < 120)) handleText(coarse ? s : s.replace(/[123]/g, ''), s.length > 2 && isLatin(s.trim()));
  ime.value = '';
});
window.addEventListener('keydown', e => {
  if (e.isComposing || composing) return;
  if (e.key === 'Enter') { e.preventDefault(); flushWord(); return; }
  if (e.key === 'Backspace' && wordBuf) { e.preventDefault(); setBuf(wordBuf.slice(0, -1)); return; }
  const m = { '1': 'k', '2': 'r', '3': 'c' }[e.key];
  if (m && !e.metaKey && !e.ctrlKey) { e.preventDefault(); setColor(m); return; }
  if (document.activeElement !== ime && e.key.length === 1 && !e.metaKey && !e.ctrlKey) focusIme();
});
cv.addEventListener('pointerdown', e => { mouse.down = true; mouse.lx = e.clientX; mouse.ly = e.clientY; ac(); });
window.addEventListener('pointermove', e => {
  const dx = e.clientX - mouse.lx, dy = e.clientY - mouse.ly;
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.t = now;
  if (mouse.down) {
    const v = 40; // 像素位移 → 速度
    if (e.shiftKey || waterMode) splat(e.clientX, e.clientY, dx * v, dy * v, MIN * 0.05, 'w', 1);
    else splat(e.clientX, e.clientY, dx * v * 0.6, dy * v * 0.6, MIN * 0.018, color, 0.45);
  }
  mouse.lx = e.clientX; mouse.ly = e.clientY;
});
window.addEventListener('pointerup', () => { mouse.down = false; if (!coarse) focusIme(); });
window.addEventListener('pointercancel', () => { mouse.down = false; });
const bar = document.getElementById('bar');
const palEl = document.getElementById('pal');
const PAL = [['k', '#1a1a1c'], ['r', '#b22a20'], ['c', '#24685f'], ['w', '']];
function setColor(c) {
  if (c === 'w') waterMode = !waterMode; else { color = c; waterMode = false; }
  [...palEl.children].forEach((b, i) => b.classList.toggle('on', PAL[i][0] === 'w' ? waterMode : !waterMode && PAL[i][0] === color));
}
for (const [c, hex] of PAL) {
  const b = document.createElement('button'); const i = document.createElement('i');
  if (hex) i.style.background = hex; else { i.style.border = '2px solid #4a8fa0'; i.style.width = i.style.height = '12px'; }
  b.appendChild(i); b.onclick = () => { setColor(c); focusIme(); }; palEl.appendChild(b);
}
function applyLang() {
  const L = I18N[LANG];
  document.body.classList.toggle('en', LANG === 'en');
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.title = L.title;
  document.getElementById('tag').textContent = L.tag;
  document.getElementById('bAuto').textContent = L.auto;
  document.getElementById('bSound').textContent = L.sound;
  document.getElementById('bShot').textContent = L.shot;
  document.getElementById('bLang').textContent = L.lang;
  document.getElementById('write').textContent = L.write;
  document.getElementById('hint').textContent = coarse ? L.hintM : L.hint;
  [...palEl.children].forEach((b, i) => { b.title = L.pal[i]; b.setAttribute('aria-label', L.pal[i]); });
  bar.innerHTML = '';
  for (const ch of BAR) {
    const b = document.createElement('button'), label = LANG === 'en' ? EN_WORD[ch] : ch;
    b.textContent = label; b.title = LANG === 'en' ? ch : EN_WORD[ch];
    b.onclick = () => { ac(); queue.push(label); focusIme(); }; bar.appendChild(b);
  }
}
applyLang(); setColor('k');
document.getElementById('bLang').onclick = function () {
  LANG = LANG === 'en' ? 'zh' : 'en'; try { localStorage.setItem('mosheng-lang', LANG); } catch (e) { }
  const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u); applyLang(); focusIme();
};
document.getElementById('write').onclick = () => { ac(); ime.value = ''; focusIme(true); };
let autoOn = false, autoT = 0;
document.getElementById('bAuto').onclick = function () { autoOn = !autoOn; this.classList.toggle('on', autoOn); autoT = 0.5; focusIme(); };
document.getElementById('bSound').onclick = function () { soundOn = !soundOn; this.classList.toggle('on', soundOn); if (soundOn) ac(); focusIme(); };
document.getElementById('bShot').onclick = function () { const a = document.createElement('a'); a.download = (LANG === 'en' ? 'mosheng-' : '墨生-') + Date.now() + '.png'; a.href = cv.toDataURL('image/png'); a.click(); focusIme(); };

// ========== 主循环 ==========
function resize() {
  const nw = innerWidth, nh = innerHeight;
  // 手机弹出键盘只改高度：保持画布不变，免得画面被清掉
  if (W && coarse && nw === W && nh < H) return;
  DPR = Math.min(2, window.devicePixelRatio || 1); W = nw; H = nh; MIN = Math.min(W, H);
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paperPat = ctx.createPattern(paperTex, 'repeat'); initFluid();
}
window.addEventListener('resize', resize); resize();
let last = performance.now();
function frame(ms) {
  const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
  step(dt); runLater(); draw();
  requestAnimationFrame(frame);
}
function step(dt) {
  now += dt;
  T = lerp(T, Ttarget, 1 - Math.pow(0.2, dt)); updateColors();
  windT = Math.max(0, windT - dt); wind = lerp(wind, windT > 0 ? 1 : 0, 1 - Math.pow(0.3, dt));
  if (wind > 0.05) for (let j = 2; j < gh - 2; j += 3) for (let i = 2; i < gw - 2; i += 3) U[i + j * gw] += wind * 25 * dt * (0.6 + 0.4 * Math.sin(j * 0.3 + now * 2));
  if (wordBuf) { wordT -= dt; if (wordT <= 0) flushWord(); }
  clearing = Math.max(0, clearing - dt); shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 3);
  // 字的队列：一个个出
  qBusy -= dt; if (queue.length && qBusy <= 0) { const ch = queue.shift(); qBusy = 0.35; loadFont(ch).then(() => trigger(ch)); }
  if (autoOn) { autoT -= dt; if (autoT <= 0) { autoT = 3.6; const pool = '山月竹梅鱼鸟蝶龙风雨雪火水雷'; const c = Math.random() < 0.06 ? (Ttarget ? '昼' : '夜') : pool[Math.floor(Math.random() * pool.length)]; queue.push(LANG === 'en' ? EN_WORD[c] : c); } }
  fluidStep(dt);
  for (const o of scene) { if (o.update) o.update(dt); if (o.dying) o.fade -= dt / 1.5; }
  scene = scene.filter(o => o.fade > 0);
  for (const f of fx) f.update(dt);
  fx = fx.filter(f => !f.done);
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-6, 6) * shake, rand(-6, 6) * shake);
  ctx.fillStyle = rgba(C.paper, 1); ctx.fillRect(-10, -10, W + 20, H + 20);
  ctx.globalAlpha = 0.55 * (1 - T) + 0.06 * T; ctx.fillStyle = paperPat; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(W / 2, H / 2, MIN * 0.4, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(${T > .5 ? '0,0,0,0.5' : '90,70,40,0.12'})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  for (const o of scene) if (o.kind === '山' || o.kind === '月') o.draw();
  renderDye();
  for (const o of scene) if (o.kind !== '山' && o.kind !== '月') o.draw();
  const night = T > 0.5;
  for (const f of fx) { if (f instanceof FireP && night) ctx.globalCompositeOperation = 'lighter'; f.draw(); ctx.globalCompositeOperation = 'source-over'; }
  if (flash > 0) { ctx.fillStyle = night ? `rgba(220,230,255,${flash * 0.5})` : `rgba(255,255,255,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
requestAnimationFrame(frame);
focusIme();
// 开场：“墨生”两个字化开
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(() => loadFont('墨生')).then(() => {
  fx.push(new Glyph('墨', W * 0.42, H * 0.42, 'k')); fx.push(new Glyph('生', W * 0.58, H * 0.42, 'k'));
});
// 供测试：window.__type('山月龙')
window.__type = s => handleText(s);
window.__trig = ch => trigger(ch);
window.__lang = l => { LANG = l; applyLang(); };
window.__sim = sec => { for (let t = 0; t < sec; t += 1 / 30) { step(1 / 30); runLater(); } draw(); };
</script>
